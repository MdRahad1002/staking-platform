<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" fill="url(#bgGrad)" rx="20"/>
  <rect width="800" height="260" fill="none" stroke="#ffffff10" stroke-width="1" rx="20"/>

  <!-- Sponsor badge -->
  <rect x="30" y="22" width="180" height="26" rx="13" fill="#f59e0b20"/>
  <text x="120" y="39" fill="#f59e0b" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">OFFICIAL PARTNER</text>

  <!-- Left: Bodo/Glimt Badge/Crest area -->
  <circle cx="130" cy="145" r="75" fill="#f59e0b12" stroke="#f59e0b30" stroke-width="1.5"/>
  <!-- Simplified shield crest -->
  <path d="M130 80 L168 95 L168 140 Q168 168 130 182 Q92 168 92 140 L92 95 Z" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M130 85 L163 99 L163 139 Q163 164 130 177 Q97 164 97 139 L97 99 Z" fill="none" stroke="#fbbf24" stroke-width="1"/>

  <!-- BG Letters on shield -->
  <text x="115" y="133" fill="#f59e0b" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" text-anchor="middle">B</text>
  <text x="145" y="133" fill="#f59e0b" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" text-anchor="middle">G</text>

  <!-- Stars below -->
  <text x="118" y="155" fill="#f59e0b" font-size="8" text-anchor="middle">★ ★ ★</text>
  <text x="143" y="155" fill="#f59e0b" font-size="8" text-anchor="middle">★ ★ ★</text>

  <!-- Club Name -->
  <text x="130" y="205" fill="#fbbf24" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">BODØ/GLIMT</text>
  <text x="130" y="222" fill="#f59e0b80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" letter-spacing="3">NORWAY · SINCE 1916</text>

  <!-- Divider -->
  <line x1="250" y1="60" x2="250" y2="200" stroke="#ffffff10" stroke-width="1"/>

  <!-- Right: Partnership text -->
  <text x="295" y="105" fill="#ffffff90" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3">PROUD CRYPTO PARTNER</text>

  <!-- x mark -->
  <text x="295" y="145" fill="#ffffff" font-family="Arial Black, sans-serif" font-size="38" font-weight="900">×</text>

  <!-- Stake Onix branding -->
  <text x="355" y="145" fill="url(#cyanGrad)" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" letter-spacing="-1">Stake</text>
  <text x="545" y="145" fill="#ffffff" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" letter-spacing="-1">Onix</text>

  <!-- Tagline -->
  <text x="295" y="175" fill="#06b6d460" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">Official Crypto Staking Partner 2025–2026</text>

  <!-- Bottom bar -->
  <rect x="30" y="235" width="740" height="2" rx="1" fill="url(#yellowGrad)" opacity="0.4"/>
</svg>
